# What to download, where it goes and how to check it.
#
#   python scripts/download_weights.py --dry-run            # show the plan
#   python scripts/download_weights.py                      # fetch everything possible
#   python scripts/download_weights.py --only wilor,hawor    # subset
#   python scripts/download_weights.py --verify-only         # audit what is on disk
#
# IMPORTANT: the URLs below were transcribed from each project's documentation on
# 2026-09-23 and could NOT be verified from the development machine (no network
# access). Every download is checked for size and format (and sha256 where
# recorded), and any entry whose URL has moved can be fixed without touching
# code:
#
#   python scripts/download_weights.py --url-override hawor_checkpoint=https://...
#
# Placeholders are written as <...> - entries containing a placeholder are
# reported as "manual download required" instead of being fetched.
#
# `format` is sniffed from the file content: torch_zip (modern torch.save),
# pickle (legacy torch.save), safetensors, npz, zip, any.

assets:
  - id: wilor_checkpoint
    backend: wilor
    dest: wilor/wilor_final.ckpt
    sources:
      - https://huggingface.co/rolpotamias/WiLoR/resolve/main/pretrained_models/wilor_final.ckpt
    format: torch_zip
    min_bytes: 10000000
    note: "WiLoR detector: WiLoR/wilor_final.ckpt"
    page: https://github.com/rolpotamias/WiLoR

  - id: wilor_config
    backend: wilor
    dest: wilor/model_config.yaml
    sources:
      - https://raw.githubusercontent.com/rolpotamias/WiLoR/main/pretrained_models/model_config.yaml
    format: any
    min_bytes: 100
    note: "WiLoR model config; also ships inside the checkout at pretrained_models/"
    page: https://github.com/rolpotamias/WiLoR

  - id: hawor_checkpoint
    backend: hawor
    dest: hawor/checkpoints/hawor.ckpt
    sources:
      - hf://ThunderVVV/HaWoR/hawor.ckpt
    format: torch_zip
    min_bytes: 10000000
    note: "HaWoR main checkpoint (HaWoR/weights/hawor/checkpoints/hawor.ckpt)"
    page: https://github.com/ThunderVVV/HaWoR

  - id: hawor_infiller
    backend: hawor
    dest: hawor/checkpoints/infiller.pt
    sources:
      - hf://ThunderVVV/HaWoR/infiller.pt
    format: torch_zip
    min_bytes: 1000000
    note: "HaWoR temporal infiller (needed for the full-sequence hands)"
    page: https://github.com/ThunderVVV/HaWoR

  - id: hawor_detector
    backend: hawor
    dest: external/detector.pt
    sources:
      - hf://ThunderVVV/HaWoR/detector.pt
    format: torch_zip
    min_bytes: 1000000
    optional: true
    note: "HaWoR's own YOLO detector; this project uses WiLoR instead, so it is optional"
    page: https://github.com/ThunderVVV/HaWoR

  - id: vggt_omega_reproduction
    backend: vggt
    dest: vggt-omega/VGGT-Omega-1B-416-Reproduction/model.safetensors
    sources:
      - hf://<org>/VGGT-Omega-1B-416-Reproduction/model.safetensors
    format: safetensors
    min_bytes: 1000000000
    note: "TEXT-ALIGNED/DEFAULT 416 checkpoint (the reference configuration uses this one)"
    page: https://github.com/facebookresearch/vggt
    post_step: |
      The VGGT-Omega release page publishes VGGT-Omega-1B-512,
      VGGT-Omega-1B-416-Reproduction and VGGT-Omega-1B-256-Text-Alignment.
      This project uses the 416 reproduction checkpoint (never a resized 512).
      Copy every file of that checkpoint directory (model.safetensors + config)
      into weights/vggt-omega/VGGT-Omega-1B-416-Reproduction/, then run
      `python scripts/download_weights.py --verify-only`.

  - id: mano_right
    backend: mano
    dest: mano/MANO_RIGHT.pkl
    auth: manual
    min_bytes: 1000000
    note: "MANO right-hand model: register and accept the licence, then download"
    page: https://mano.is.tue.mpg.de/
    post_step: |
      python scripts/convert_mano.py --input weights/mano/MANO_RIGHT.pkl \
          --output-dir weights/mano
      # then set paths.mano_model: weights/mano in configs/hot3d.yaml to get
      # 21-joint references instead of wrist-only ones.

  - id: mano_left
    backend: mano
    dest: mano/MANO_LEFT.pkl
    auth: manual
    min_bytes: 1000000
    optional: true
    note: "optional: MANO_RIGHT alone is enough (the left hand is mirrored)"
    page: https://mano.is.tue.mpg.de/
