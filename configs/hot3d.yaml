# HOT3D evaluation profile: same pipeline as macrodata_final, plus dataset
# locations and the benchmark protocol.
runtime:
  device: auto
  seed: 0
  log_level: INFO

paths:
  data_root: data/hot3d    # the HOT3D profile keeps its clips apart from ad-hoc ones
  third_party: third_party
  weights: weights
  outputs: outputs
  hot3d_root: data/hot3d
  lerobot_root: data/samples/lerobot_v3
  mano_model: null         # e.g. weights/mano (see scripts/convert_mano.py)
  backends: backends

backends:
  mode: real               # real | mock  (mock = deterministic stand-in, never a model)
  python:
    wilor: ["conda", "run", "-n", "ego3d_wilor", "python"]
    hawor: ["conda", "run", "-n", "ego3d_hawor", "python"]
    vggt: ["conda", "run", "-n", "ego3d_vggt", "python"]
  timeout_seconds: 7200
  seed: 0

preprocess:
  image_format: jpg
  jpeg_quality: 2

detection:
  min_confidence: 0.75
  max_gap: 4
  iou_threshold: 0.20

hand:
  window: 16
  overlap: 8
  batch_size: 4

camera:
  resolution: 416
  window: 200
  overlap: 40
  checkpoint: VGGT-Omega-1B-416-Reproduction
  use_depth_confidence: true

stitch:
  pixel_stride: 8
  min_depth: 0.001
  max_depth: null
  depth_confidence_floor: null
  inlier_threshold: null
  ransac_iterations: 128
  blend: true
  normalize_world: true

refinement:
  camera_filter_passes: 1
  bone_scale_max_correction: 0.035
  bone_scale_reference: median
  wrist_depth_lambda: 0.2
  wrist_depth_max_change: null

evaluation:
  dataset: hot3d
  chunk_seconds: 1.0       # 1-second action chunks (Action-MPJPE)
  strict_artefacts: true
  episodes: []             # filled in from the HOT3D sequence list
  report_json: outputs/hot3d_report.json

visualization:
  enabled: true
  fps: null
  draw_bbox: true
  draw_confidence: true
