# End-to-end profile that swaps the three model backends for the deterministic
# stand-in in backends/mock_backend.py. Same reference parameters, same artefact
# contract, no GPU. Every stage records "backend_mode: mock" in its metadata.
runtime:
  device: cpu              # the mock is numpy-only; keep it deterministic
  seed: 0
  log_level: INFO

paths:
  data_root: data
  third_party: third_party
  weights: weights
  outputs: outputs
  backends: backends

backends:
  mode: mock
  python:
    wilor: ["conda", "run", "-n", "ego3d_wilor", "python"]
    hawor: ["conda", "run", "-n", "ego3d_hawor", "python"]
    vggt: ["conda", "run", "-n", "ego3d_vggt", "python"]
  timeout_seconds: 600
  seed: 0

preprocess:
  image_format: jpg
  jpeg_quality: 2

detection:
  min_confidence: 0.75
  max_gap: 4
  iou_threshold: 0.20

hand:
  window: 16
  overlap: 8
  batch_size: 4

camera:
  resolution: 416
  window: 200
  overlap: 40
  checkpoint: VGGT-Omega-1B-416-Reproduction
  use_depth_confidence: true

stitch:
  pixel_stride: 8
  min_depth: 0.001
  max_depth: null
  depth_confidence_floor: null
  inlier_threshold: null
  ransac_iterations: 128
  blend: true
  normalize_world: true

refinement:
  camera_filter_passes: 1
  bone_scale_max_correction: 0.035
  bone_scale_reference: median
  wrist_depth_lambda: 0.2
  wrist_depth_max_change: null

evaluation:
  dataset: mock
  chunk_seconds: 1.0
  strict_artefacts: true

visualization:
  enabled: true
  fps: null
  draw_bbox: true
  draw_confidence: true
