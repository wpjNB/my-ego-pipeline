# HOT3D evaluation profile, Tesla P100 host variant (aius-01).
#
# Same dataset locations and benchmark protocol as hot3d.yaml (which stays the
# hardware-independent reference at 200/40 windows and per-backend envs), with
# the three deviations this host forces - the same decisions unified.yaml
# records, kept apart so the benchmark definition itself does not drift with
# the hardware:
#
#   1. One shared `ego3d` env for all backends (torch 2.8+cu126): the
#      torch-1.13 pin only existed for DROID-SLAM + Metric3D, which
#      VGGT-Omega replaces. The per-backend envs are never created here.
#   2. VGGT fp16 (aggregator 4.26 -> 2.13 GiB resident); HaWoR stays fp32.
#   3. camera.window 8, overlap 4, NOT the reference 200/40: Tesla P100
#      (sm_60) has no flash-attention kernel, so PyTorch's
#      scaled_dot_product_attention falls back to the memory-hungry math path
#      and a 12 GB card OOMs past ~8 frames. This is what the 2026-09-29
#      hot3d_ep000 run used; the ablation table records it.
runtime:
  device: auto
  seed: 0
  log_level: INFO

paths:
  data_root: data/hot3d    # the HOT3D profile keeps its clips apart from ad-hoc ones
  third_party: third_party
  weights: weights
  outputs: outputs
  hot3d_root: data/hot3d
  lerobot_root: data/samples/lerobot_v3
  mano_model: weights/mano # enables 21-joint references; use --no-mano to fall
                           # back to wrist-only (the directory is git-ignored)
  backends: backends

backends:
  mode: real               # real | mock  (mock = deterministic stand-in, never a model)
  # One shared environment on this host, same decision as unified.yaml: the
  # torch-1.13 pin only existed for DROID-SLAM + Metric3D, which VGGT-Omega
  # replaces. The three per-backend envs (ego3d_wilor/...) are never created.
  python:
    wilor: ["/home/pjwang/miniforge3/envs/ego3d/bin/python"]
    hawor: ["/home/pjwang/miniforge3/envs/ego3d/bin/python"]
    vggt: ["/home/pjwang/miniforge3/envs/ego3d/bin/python"]
  # fp16 halves VGGT's resident aggregator; HaWoR stays fp32 (its infiller
  # mixes the camera trajectory with float32 model outputs). See unified.yaml.
  precision: fp16
  hand_precision: fp32
  timeout_seconds: 7200
  seed: 0

preprocess:
  image_format: jpg
  jpeg_quality: 2

detection:
  detector_confidence: 0.1
  # min_confidence gates ANCHORS. The 0.75 spec exists because WiLoR's 0.5-0.75
  # band on this lens is full of forearm / frame-edge fragments, and anchoring
  # them reconstructed phantom hands after the real hand left the view
  # (hot3d_ep003 windows 144-175). The relaxed max_gap 8 + continuity tracker
  # keep the coverage; the low band only feeds IoU-gated gap recovery.
  # Tracker thresholds relaxed below the reference profile's 0.75/4, measured
  # on hot3d_ep000 (2026-09-29, doc_auto/ablation.md): hand coverage
  # 54.8 % -> 78.1 % (left detection 22.7 % -> 58.7 %), wrist error improves
  # slightly, MPJPE stays ~flat (+2.2 mm - the recovered frames are the hard
  # ones). Continuity is worth more than the metric delta on this host.
  # 2026-10-01 experiment: 0.65 - most dropout frames still carry a WiLoR
  # candidate at 0.59-0.74 (e.g. ep003 333-377: 69 % of frames), so 0.75
  # discards visible hands. Measured (vs the 0.75 baseline
  # ep000 161.4 mm / 63.6 %, ep003 185.4 mm / 69.3 %):
  #   ep000: coverage 63.6 -> 88.0 %, Action-MPJPE 162.6 -> 162.7 mm (flat),
  #          wrist 67.0 -> 61.6 mm
  #   ep003: coverage 69.3 -> 82.4 %, Action-MPJPE 185.4 -> 194.3 mm (+4.8 %),
  #          wrist 84.3 -> 90.6 mm - the cost sits in ~19 recovered low-conf
  #          frames (361-379, 30-58 cm wrist error, no runaway window).
  # No phantom divergence: every wrist stays within 64 cm of the camera.
  # Kept for continuity (dropouts were the visible failure); revert to 0.75
  # for the conservative metric profile.
  min_confidence: 0.65
  max_gap: 8
  # Widen tracked boxes before HaWoR: the tracker's tight boxes cut fingers
  # out of the 256px crops, and HaWoR then guesses the hidden finger depth
  # (up to +25 cm away-from-camera at the fingertips). 1.5x measured on
  # hot3d_ep000 (2026-09-30): finger-z bias down ~20%, Action-MPJPE
  # 187.9 -> 161.6 mm. Wrist error trades up slightly (38 -> 57 mm).
  box_padding: 1.5
  iou_threshold: 0.20

hand:
  window: 16
  overlap: 8
  # WiLoR crop padding (scripts/run_hand_wilor.py). Sweep on hot3d_ep000
  # (2026-10-01): 2.0 = the WiLoR demo default, 2.5 = this checkout's own
  # ViTDetDataset default, 3.0 dilutes the hand. 2.5 tracked the visible
  # hands best in the f150/f300/f380 overlays - larger crops give the wrist
  # more forearm context, which the demo's tighter 2.0 starves.
  wilor_rescale: 2.5
  # One [1,2,1] pass over the blended camera-space hands damps the white
  # reconstruction noise (wrist step 17-20 -> 11 mm/frame). The remaining
  # wobble is HaWoR's own mid-frequency oscillation (~2 deg/frame), which more
  # passes cannot touch without smearing real motion - measured 2026-09-30.
  smooth_passes: 1
  batch_size: 4

camera:
  resolution: 416
  # NOT the reference 200/40: Tesla P100 (sm_60) has no flash-attention kernel,
  # so PyTorch's scaled_dot_product_attention falls back to the memory-hungry
  # math path and a 12 GB card OOMs past ~8 frames. 8/4 is the P100 maximum
  # with idle cards; the ablation table must note which window was used.
  window: 8
  overlap: 4
  # Measured resident memory at these windows: 8.5 GiB. The batch scheduler's
  # default camera floor (16 GB) describes the reference 200/40 windows; this
  # profile declares what it actually needs so dispatch matches honestly.
  min_gpu_memory_gb: 12.0
  checkpoint: VGGT-Omega-1B-416-Reproduction   # file: vggt_omega_1b_416_reproduce.pt
  use_depth_confidence: true

stitch:
  pixel_stride: 8
  min_depth: 0.001
  max_depth: null
  depth_confidence_floor: null
  inlier_threshold: null
  ransac_iterations: 128
  blend: true
  normalize_world: true

refinement:
  camera_filter_passes: 1
  bone_scale_max_correction: 0.035
  bone_scale_reference: mean  # the reference recipe (blog ablation: mean wins, median regressed)
  wrist_depth_lambda: 0.2
  wrist_depth_max_change: null
  # P2 short-gap interpolation: longest missing run that is filled.
  gap_fill_max_frames: 12
  # P3 UKF + unscented RTS (reference UI defaults, "lighter smoothing").
  # q up = follows the hand more; r/beta up = smoother.
  # Recommended q 0.4-1.0, r 0.3-1.0, beta 0.2-3.0; safe q/r 0.1-2.0, beta 0-5.
  # Measured on ep000/ep003 (doc_auto/ablation.md): every set keeps MPJPE
  # within 0.6 mm, only the residual jitter differs - this set cuts it 50-60 %,
  # the library default 0.6/0.6/2.0 cuts 57-69 %.
  ukf_q: 0.7
  ukf_r: 0.5
  ukf_beta: 0.3
  ukf_rts: true

evaluation:
  dataset: hot3d
  chunk_seconds: 1.0       # 1-second action chunks (Action-MPJPE)
  strict_artefacts: true
  episodes: []             # filled in from the HOT3D sequence list
  report_json: outputs/hot3d_report.json

visualization:
  enabled: true
  wilor_box_nudge: 0.0  # opt in per clip only after image-space validation
  fps: null
  draw_bbox: true
  draw_confidence: true
